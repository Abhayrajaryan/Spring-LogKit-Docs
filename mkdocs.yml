site_name: Spring LogKit
site_description: Annotation-driven logging library for Spring Boot applications
site_author: Abhay Raj Aryan
repo_url: https://github.com/abhayrajaryan/spring-logkit
repo_name: abhayrajaryan/spring-logkit

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Annotations: annotations.md
  - Customization: customization.md
  - Internals: internals.md
  - Examples: examples.md
  - FAQ: faq.md
  - Behind Spring LogKit: behind-spring-logkit.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/abhayrajaryan/spring-logkit

copyright: Copyright &copy; 2024 Abhay Raj Arya
